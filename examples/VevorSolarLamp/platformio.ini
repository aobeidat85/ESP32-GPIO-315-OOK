[platformio]
src_dir = .

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../..

[env:esp32]
board = esp32dev

[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
